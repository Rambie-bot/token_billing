name: "Админка: новый клиент"

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Название клиента"
        required: true
      project_id:
        description: "Project ID в OpenAI (proj_...)"
        required: true
      amount:
        description: "Сумма первого счёта, ₽"
        required: true
      paid:
        description: "Счёт уже оплачен?"
        type: choice
        options: ["да", "нет"]
        default: "да"
      date:
        description: "Дата оплаты/выставления (12.11.2026). Пусто = сегодня"
        required: false
        default: ""
      commission:
        description: "Комиссия, %. Пусто = как у всех (10%)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: billing-monitor
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add client
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          IN_NAME: ${{ inputs.name }}
          IN_PID: ${{ inputs.project_id }}
          IN_AMOUNT: ${{ inputs.amount }}
          IN_PAID: ${{ inputs.paid }}
          IN_DATE: ${{ inputs.date }}
          IN_FEE: ${{ inputs.commission }}
        run: python3 admin.py add-client --name "$IN_NAME" --project-id "$IN_PID" --amount "$IN_AMOUNT" --paid "$IN_PAID" --date "$IN_DATE" --commission "$IN_FEE"

      - name: Save
        env:
          WHO: ${{ github.actor }}
          IN_NAME: ${{ inputs.name }}
        run: |
          git config user.name "billing-admin"
          git config user.email "billing-admin@users.noreply.github.com"
          git add clients.json
          git commit -m "Новый клиент: $IN_NAME (by $WHO)"
          git pull --rebase origin main
          git push origin HEAD:main
