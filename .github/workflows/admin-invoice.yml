name: "Админка: выставлен счёт"

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Клиент (как в списке, например: Займер)"
        required: true
        default: "Займер"
      amount:
        description: "Сумма счёта, ₽ (например 80000)"
        required: true
      date:
        description: "Дата выставления (12.11.2026). Пусто = сегодня"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: billing-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update clients.json
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          IN_CLIENT: ${{ inputs.client }}
          IN_AMOUNT: ${{ inputs.amount }}
          IN_DATE: ${{ inputs.date }}
        run: python3 admin.py invoice --client "$IN_CLIENT" --amount "$IN_AMOUNT" --date "$IN_DATE"

      - name: Save
        env:
          WHO: ${{ github.actor }}
          IN_CLIENT: ${{ inputs.client }}
          IN_AMOUNT: ${{ inputs.amount }}
        run: |
          git config user.name "billing-admin"
          git config user.email "billing-admin@users.noreply.github.com"
          git add clients.json
          git commit -m "Счёт: $IN_CLIENT, $IN_AMOUNT (by $WHO)"
          git pull --rebase origin main
          git push origin HEAD:main
